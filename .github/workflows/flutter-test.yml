name: Flutter analyze and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test --coverage
      - name: Report the coverage of the tests (report only, no floor yet)
        run: |
          awk -F'[:,]' '/^SF:/{f=$2} /^DA:/{t[f]++; if ($3>0) h[f]++; T++; if ($3>0) H++} END{for (f in t) printf "%6.1f%% %4d/%-4d %s\n", 100*h[f]/t[f], h[f], t[f], f | "sort -n"; close("sort -n"); printf "TOTAL %.1f%% (%d/%d lines)\n", 100*H/T, H, T}' coverage/lcov.info | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo "### Test coverage (report only)"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
