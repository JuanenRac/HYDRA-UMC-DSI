name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the HYDRA-UMC-SDK contracts for the route check
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-umc-sdk"
          curl -fsSL --retry 3 https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.6.0.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hydra-umc-sdk"
          echo "HYDRA_UMC_SDK_DIR=$RUNNER_TEMP/hydra-umc-sdk" >> "$GITHUB_ENV"
          echo "HYDRA_UMC_REQUIRE_WORKSPACE=1" >> "$GITHUB_ENV"
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
      - name: Check the kiosk installer and its local screen setting
        run: python tools/verify_kiosk_screen.py
  linux-build:
    name: Build the Linux app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build for Linux
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
